<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFECB3" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" />
  
  <!-- Subtle Gold Outer Border -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 5" opacity="0.8" />
  
  <!-- Steam Whisps -->
  <path d="M 45 42 Q 52 32 45 22 Q 38 12 45 2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 60 38 Q 68 28 60 18 Q 52 8 60 -2" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 75 42 Q 82 32 75 22 Q 68 12 75 2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Elegant Chinese Porcelain Bowl -->
  <path d="M 25 55 Q 60 95, 95 55 Z" fill="#FAFAFA" />
  <!-- Bowl inner depth -->
  <ellipse cx="60" cy="55" rx="35" ry="8" fill="#EEEEEE" />
  
  <!-- Bowl Base -->
  <path d="M 48 83 L 50 92 L 70 92 L 72 83 Z" fill="#E0E0E0" />
  
  <!-- Gold Accent on Bowl Lip -->
  <ellipse cx="60" cy="55" rx="35" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <path d="M 48 92 L 72 92" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Chopsticks -->
  <path d="M 15 50 L 105 40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 15 46 L 105 36" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Character 温甜 (Warm Sweet) -->
  <text x="60" y="76" font-family="'Kaiti', 'STKaiti', serif" font-weight="bold" font-size="14" fill="#B71C1C" text-anchor="middle">温甜</text>
</svg>